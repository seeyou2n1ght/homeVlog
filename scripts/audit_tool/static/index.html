<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeVlog Streamlined Reviewer • 极速审核台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="dark-theme">
  <!-- 极简 Header (44px) -->
  <header class="app-header">
    <div class="header-brand">
      <span class="brand-logo">⚡</span>
      <span class="brand-title">HomeVlog <span class="brand-sub">Reviewer</span></span>
    </div>

    <!-- 当前批次已审进度 -->
    <div class="batch-progress-capsule">
      <span class="progress-label">当前批次复核:</span>
      <span class="progress-count font-mono" id="batch-progress-text">0 / 0</span>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="batch-progress-fill" style="width: 0%"></div>
      </div>
    </div>

    <!-- 快捷键心流提示 -->
    <div class="hotkey-pill-strip">
      <span class="hotkey-tag keep"><kbd>1</kbd> 有效动态</span>
      <span class="hotkey-tag drop"><kbd>2</kbd> 静态/误报</span>
      <span class="hotkey-tag subtle"><kbd>J</kbd>/<kbd>K</kbd> 切换</span>
      <span class="hotkey-tag subtle"><kbd>U</kbd> 撤销</span>
    </div>

    <!-- 右侧工具收纳下拉菜单 -->
    <div class="header-actions">
      <div class="dropdown-menu-wrap">
        <button class="btn-menu-trigger" id="btn-tools-menu">⚙️ 工具与导出 ▾</button>
        <div class="dropdown-menu-panel hidden" id="tools-menu-panel">
          <button class="menu-item" id="btn-export-gold">🏆 导出评测基准 (Benchmark)</button>
          <button class="menu-item" id="btn-open-tuning">💡 调参量化建议</button>
          <button class="menu-item" id="btn-open-yolo">🏷️ 导出 YOLO 数据集</button>
          <button class="menu-item" id="btn-open-rerender">🚀 重新浓缩成片</button>
          <button class="menu-item" id="btn-export-csv">📊 导出 CSV 报表</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 主屏双栏工作区 (100% 视口无滚动) -->
  <main class="reviewer-main">
    <!-- 左侧切片队列面板 (300px) -->
    <aside class="queue-sidebar">
      <!-- 队列筛选胶囊 -->
      <div class="queue-filter-bar">
        <button class="filter-chip active" data-category="gold_candidates" id="chip-gold">
          🌟 黄金精选 <span class="chip-count" id="count-gold">0</span>
        </button>
        <button class="filter-chip" data-category="all" id="chip-all">
          全部待审 <span class="chip-count" id="count-all">0</span>
        </button>
        <button class="filter-chip" data-category="reviewed" id="chip-reviewed">
          已审 <span class="chip-count" id="count-reviewed">0</span>
        </button>
      </div>

      <!-- 搜索与隐藏已审开关 -->
      <div class="queue-subtoolbar">
        <input type="text" id="queue-search-input" class="search-input" placeholder="🔍 搜索文件名/原因..." />
        <label class="toggle-reviewed-label" title="开启后已复核切片自动移出队列">
          <input type="checkbox" id="toggle-hide-reviewed" />
          <span>隐藏已审</span>
        </label>
      </div>

      <!-- 切片紧凑列表容器 -->
      <div class="queue-list" id="queue-list-container">
        <!-- JS 动态渲染单行紧凑切片卡片 -->
      </div>
    </aside>

    <!-- 中央核心舞台 (完全自适应视窗) -->
    <section class="stage-section">
      <!-- 顶部信息胶囊条 -->
      <div class="stage-info-bar font-mono">
        <span class="info-tag-id" id="seg-id-badge">#--</span>
        <span class="info-tag-state" id="seg-state-badge">STATE</span>
        <span class="info-tag-time" id="seg-time-range">00:00:00 - 00:00:00</span>
        <span class="info-tag-dur" id="seg-dur-badge">0.0s</span>
        <span class="info-tag-reason" id="seg-reason-badge">--</span>
        <span class="info-cluster-tag hidden" id="seg-cluster-badge">⚡ 聚类 x--</span>
      </div>

      <!-- 核心微视频/动态视窗 (占据绝大部分视口) -->
      <div class="stage-canvas-box" id="stage-canvas-box">
        <!-- 主循环预览 (WebP/高清动态) -->
        <img id="main-player-img" class="main-player" alt="Video Player" />
        <div class="player-loading-spinner hidden" id="player-spinner">
          <div class="spinner-ring"></div>
          <span class="spinner-tip">正在载入动态画面...</span>
        </div>

        <!-- 悬停指示徽标 -->
        <div class="hero-hover-badge font-mono" id="hero-badge">DYNAMIC LOOP</div>
      </div>

      <!-- 底部三联微缩帧对比卡 (轻量高度 64px) -->
      <div class="strip-thumbnails-bar">
        <div class="thumb-card" id="thumb-start">
          <span class="thumb-label">起点进入</span>
          <img id="img-thumb-start" class="thumb-img" alt="Start Frame" />
        </div>
        <div class="thumb-card active" id="thumb-mid">
          <span class="thumb-label">峰值检验</span>
          <img id="img-thumb-mid" class="thumb-img" alt="Peak Frame" />
        </div>
        <div class="thumb-card" id="thumb-end">
          <span class="thumb-label">终点离开</span>
          <img id="img-thumb-end" class="thumb-img" alt="End Frame" />
        </div>
      </div>
    </section>
  </main>

  <!-- 底部纯净决策操控台 (固定吸底 60px) -->
  <footer class="reviewer-footer">
    <div class="footer-left">
      <button class="nav-arrow-btn" id="btn-prev" title="快捷键 K 或 ↑">▲ 上一个 (K)</button>
      <button class="nav-arrow-btn" id="btn-next" title="快捷键 J 或 ↓">▼ 下一个 (J)</button>
      <button class="btn-clear-sm" id="btn-clear" title="快捷键 U">↩ 撤销打标 (U)</button>
    </div>

    <!-- 核心两键/四键极简打标卡组 -->
    <div class="footer-decisions">
      <button class="decision-pill btn-keep" id="btn-action-keep" data-action="keep">
        <span class="key-kbd">1</span>
        <div class="action-texts">
          <span class="action-main">有效动态 (Keep)</span>
          <span class="action-sub font-mono" id="sub-keep-desc">维持原速 • 保留高光</span>
        </div>
      </button>

      <button class="decision-pill btn-drop" id="btn-action-drop" data-action="drop">
        <span class="key-kbd">2</span>
        <div class="action-texts">
          <span class="action-main">静态 / 误报 (Drop)</span>
          <span class="action-sub font-mono" id="sub-drop-desc">快进掠过 • 标记背景</span>
        </div>
      </button>

      <!-- 展开四键专业模式开关 -->
      <button class="btn-mode-toggle" id="btn-toggle-4keys" title="展开细粒度 TP/FP/FN/TN 四分类">四键模式 ▾</button>
    </div>

    <!-- 四键展开弹层 (默认隐藏) -->
    <div class="quad-keys-drawer hidden" id="quad-keys-drawer">
      <button class="btn-quad btn-quad-tp" id="btn-quad-tp" data-label="CONFIRMED_MOTION"><kbd>1</kbd> TP 有效动态</button>
      <button class="btn-quad btn-quad-fp" id="btn-quad-fp" data-label="FALSE_ALARM"><kbd>2</kbd> FP 光影误报</button>
      <button class="btn-quad btn-quad-fn" id="btn-quad-fn" data-label="MISSED_MOTION"><kbd>3</kbd> FN 漏报微动</button>
      <button class="btn-quad btn-quad-tn" id="btn-quad-tn" data-label="CONFIRMED_STATIC"><kbd>4</kbd> TN 纯静止</button>
    </div>

    <div class="footer-right">
      <span class="cluster-sweep-hint hidden" id="cluster-sweep-hint">
        <span class="spark-icon">⚡</span> 按住 <kbd>Shift+1/2</kbd> 批量处理关联切片
      </span>
    </div>
  </footer>

  <!-- 吐司消息通知 (Toast) -->
  <div class="toast-container" id="toast-container"></div>
  <script src="/app.js"></script>
</body>
</html>
