# ===========================================================================
# HomeVlog 生产配置文件 (Target: Intel i5-12600K + NVIDIA RTX 3060Ti)
# ===========================================================================

paths:
  # 输入目录: 存放监控 MP4 素材文件 (可配置单路径字符串，或多路径列表)
  # 支持跨 NAS 共享目录与本地磁盘同时配置，系统按顺序逐一精准扫描
  input_dirs:
    - '\\192.168.5.8\LyuShare\XiaomiCamera_01_B888805AA3CD'
    # - '\\192.168.5.8\LyuShare\XiaomiCamera_02_6490C12345EF' # 多机位示例
    # - 'D:\LocalFootage\FrontDoor_Camera'                  # 本地机位示例


# 机位识别与人类友好别名映射
# 系统自动根据素材目录名解析小米摄像头 MAC 地址 (如 XiaomiCamera_01_B888805AA3CD 提取出 B888805AA3CD)
# 可以在此处将 MAC 地址映射为人类可读的机位名称；若命名模板包含 {camera}，成片将自动使用该别名（未配置时降级为 MAC 或 cam{index}）
cameras:
  B888805AA3CD: "baby_room"       # 婴儿房机位 (红外微光夜视敏感模式)
  # 6490C12345EF: "living_room"   # 客厅机位示例
  # 7811DC654321: "front_door"    # 门口机位示例

hardware:
  # YOLO 计算设备与 NVDEC 借调开关依据: ["cuda:0", "cpu"]；视频解码策略独立配置
  # RTX 3060Ti 专职负责 YOLO 张量批推理与 Pass 2 (NVENC) 硬件视频编码
  device: "cuda:0"

  # 并发控制 (信号量隔离)
  # 本项目生产安全上限；这是作业槽位，不是驱动会话数或显存保证
  max_nv_concurrency: 2
  # QSV 总作业槽位；自动为渲染保留 1 槽独立特权通道，其余供分析 Worker 并发解码
  max_qsv_concurrency: 8
  max_qsv_analysis_concurrency: 7
  max_qsv_render_concurrency: 1
  # 全局输入文件 I/O 预算（渲染按输入文件数计费，并为分析 worker 预留槽位）
  max_io_concurrency: 32


pipeline:
  # 渲染启动延迟 (秒): 等待分析队列积累素材，以便形成更大的渲染批次
  render_start_delay: 2
  # 预筛 GPU 分配策略: ["qsv_only", "alternating", "cuda_only"]
  # 仅控制 FFmpeg 回退路径；默认 keyframes 预筛使用 PyAV 软件解码
  prescreen_gpu_policy: "qsv_only"
  # 渲染硬件分配策略: ["heterogeneous", "nv_only", "qsv_only"]
  # 三路异构编队：2 NVENC (3060Ti) + 1 QSV (UHD 770) 并发协同渲染。
  # 依赖 -bsf:v dump_extra 带内参数集重注入，彻底解决异构切片 -c copy 拼接播放器兼容性。
  render_gpu_policy: "heterogeneous"

scheduler:
  # 自适应工作窃取水位线 (Adaptive Work-Stealing Watermarks)
  # 队列积压高水位线: 当待分析文件数 >= 该值且无渲染任务时，允许 NVDEC 协同加速
  watermark_high: 6
  # 队列积压低水位线: 当待分析文件数 <= 该值时，NVDEC 退出协同，回归 QSV 独占解码
  watermark_low: 3
  # 是否启用 NVDEC 协同解码 (与 QSV 协同抽干积压队列)
  # 在队列积压 (>= watermark_high) 且未启动渲染时，借调 1~3 路 NVDEC 加速出清
  nvdec_cooperative: true
  # NVDEC 最大协同解码并发数 (保持 2，保障 2 路 NVENC 渲染转码时的 NVDEC 解码带宽不被争抢)
  max_nv_decoders: 2
  # 冷启动：渲染启动前允许借调 NVDEC；不抢占已运行任务
  cold_start_burst: true
  # 显存安全保护阈值 (MB): 物理显存已用超过此阈值时强制抑制 NVDEC 借调，让步 QSV 独占，预留余量；不保证后续推理峰值
  vram_watermark_mb: 6200
  # 渲染期间是否允许 NVDEC 协同解码 (与 NVENC 物理解耦，显存 < 6200MB 且积压时允许 1 路协同加速)
  cooperative_during_render: true

recovery:
  # 是否跳过当天素材 (因为当天完整素材可能还没有备份完毕)
  skip_today: true
  # 文件稳定等待 (分钟): 0 表示不等待 (对于已完成的往日素材建议设为 0)
  scanner_freeze_minutes: 0
  # 磁盘空间保护 (GB): 剩余空间低于此值将停止流水线
  min_disk_space_gb: 20
  # 文件稳定性二次确认等待 (秒)
  file_stabilize_wait: 1.2

detection:
  # [Pass 1] 快速预筛 (Prescreen)
  prescreen_mode: "keyframes"
  prescreen_parallel: 10
  prescreen_segments: 10
  prescreen_resolution: "320x180"
  prescreen_diff_threshold: 8.5

  prescreen_extract_timeout: 120.0

  # [Pass 1.5] 精细分析 (Detailed Analysis)
  analysis_fps: 5
  analysis_resolution: "416x234" # 灰度分析与候选尺寸；小目标召回需单独评估
  analysis_max_workers: 7
  analysis_buffer_mb: 256  # 每任务候选、音频及诊断帧池预算；正式运动分析按帧消费

  
  # 自适应 FPS: 长文件降低采样率以减少解码开销
  # 沿用当前基线；低采样率存在短动作漏检风险，需按标注集评估
  analysis_fps_adaptive: true
  analysis_fps_tiers:
    short: 2
    medium: 1
    long: 0.5
    ultra_long: 0.5
  analysis_fps_tier_thresholds:
    short_max: 120
    medium_max: 600
    long_max: 1800

  # R2: 时域滑动背景模型 (EMA Background)
  ema_background_enabled: true
  ema_alpha_bg: 0.05
  ema_alpha_fg: 0.005
  bg_diff_weight: 0.6
  fg_threshold: 12.0

  # R2: 动态空间网格 (8x8) 与抗噪过滤
  grid_rows: 8
  grid_cols: 8
  cooldown_half_life: 15.0
  min_connected_cells: 2
  cell_noise_alpha: 0.02
  base_noise_thresh: 1.5
  cluster_boost: 1.2
  ambient_drift_suppress: true       # 白天大面积慢速光影漫射/日出日落均匀偏转软抑制
  ambient_drift_active_ratio: 0.35   # 激活网格覆盖率门限 (>=35% 全画幅激活)
  ambient_drift_max_energy: 5.0      # 显著运动安全上限 (<5.0 低能量漫射方可抑制，严防漏检真实动作)
  camera_motion_suppress: true       # 云台巡航/全画幅相机平移与光影漂移软抑制
  camera_motion_active_ratio: 0.65   # 激活网格覆盖率门限 (>=65% 全画幅激活)
  camera_motion_max_cov: 0.60        # 方差变异系数上限 (均匀无局部焦点)
  camera_motion_max_focal_ratio: 3.5 # 局部峰值能量聚焦比上限

  # 检测算法调优
  motion_sensitivity: 1.0
  min_motion_threshold: 2.5
  roi_crop: [0.1, 0.12, 0.8, 0.85]
  min_motion_frames: 3
  min_static_frames: 5
  noise_suppress_frames: 2
  median_filter_window: 7
  timestamp_margin: 0.5      # 预筛选关键帧抽取安全容差 (秒)


audio_vad:
  # R3: 音频 VAD 多模态配置 (Voice Activity Detection & Multimodal Decision)
  enabled: true
  noise_margin_db: 14.0      # 相对底噪容限 (dB)
  min_dbfs: -32.0            # 绝对最低激活能量 (dBFS)
  window_ms: 50              # 短时 RMS 能量分帧窗口 (ms)
  speech_min_dur: 0.5        # 声音事件最小有效持续时间 (s)
  sample_rate: 16000         # 音频 VAD 重采样标准率 (Hz)
  prescreen_audio_gate: true  # 预筛阶段是否对画面纯静态素材强制执行音频重筛 (开启：即使夜间全黑无画面动态，有啼哭声音也将立即唤醒全量分析保全)

segment:
  # 切片短时长拓扑平滑滤波开关
  apply_smoothing: true
  # 最小运动片段时长 (秒): 短于此值的动作片段将被平滑吸收
  min_motion_duration: 2.0
  # 最小静止片段时长 (秒): 短于此值的微小停顿将自动保持常速，避免眨眼式跳跃 (收紧至 3.0s 杜绝连环吞噬)
  min_static_duration: 3.0
  # 动态段吸收静止停顿的能量门槛：仅当动态段具备足够能量时才吞噬静止段，防止微弱噪点链式吞噬整段录像
  motion_absorb_energy_threshold: 12.0
  # 允许的静止间隙容差 (秒): 两个相邻运动片段间隔小于此值时直接连接
  gap_tolerance: 1.5
  # 动作事件合并间隙 (秒): 动作间静止大于此值即刻断开并转入有人驻留(PRESENCE 4x)，彻底杜绝连环吞噬
  action_coalesce_gap: 1.2
  # 动态片段前后缓冲 (秒): 确保人物入画和动作余波完整无生硬截断
  pre_roll: 1.0
  post_roll: 1.5
  # 静态片段抽帧基准与过渡参数 (优化后：快进浓缩比提升，杜绝微小静态段膨胀成片)
  static_keyframe_interval: 55.0
  keyframe_display_duration: 0.25
  min_static_display_duration: 0.3
  max_static_display_duration: 1.5
  min_segment_duration: 0.1
  macro_collapse_static: false  # 保留所有源区间，静止区间通过倍速缩短

presence:
  # R5: 有人驻留与静止陪伴平滑快进 (Presence Smoothing & Fast-Forward)
  enabled: true
  speed_factor: 4.0           # 有人静止陪伴播放倍速 (4x 温和快进)
  max_presence_gap_s: 180.0   # 人物驻留停顿最大容差 (秒)
  person_conf_threshold: 0.20 # 激活驻留状态的人物置信度下限
  night_stationary_enabled: true
  night_hours: [23, 7]        # 夜间熟睡时间段 (23:00 至 次日 07:00)
  night_speed_factor: 16.0    # 睡眠平稳期缩时倍速 (16x 延时，兼顾睡姿变迁与浓缩比)
  stationary_energy_max: 2.5  # 静止能量上限判定
  min_stationary_duration_s: 180.0 # 持续静止时长门限 (秒)


micro_motion:
  # R5: 昼夜微动与事件驱动锚点保全 (Adaptive Day/Night Micro-Motion & Event Anchor)
  enabled: true
  cruise_speed: 16.0          # 睡眠平稳期巡航缩时倍速
  # 日间显著运动门限 (防坐姿呼吸/微动被误判为 1x 常速):
  day_energy_threshold: 16.0   # 全局能量触发门限 (日间显著躯体运动，高于静坐微动底噪)
  day_cell_threshold: 35.0     # 空间网格单格能量门限 (日间肢体局部挥动/走动)
  # 夜间微动保护门限 (红外噪点与翻身微动保持 16x 延时，仅剧烈活动唤醒 1x):
  night_energy_threshold: 18.0 # 全局能量门限 (夜间红外抗噪保护)
  night_cell_threshold: 45.0   # 空间网格单格能量门限 (夜间红外抗噪保护)
  min_active_cells: 2          # 最小连通活跃网格数
  hysteresis_low_ratio: 0.65   # 迟滞维持低门限比例
  max_maintain_duration: 2.0   # 迟滞维持最大窗口 (秒)，杜绝常速无界顺延
  max_coalesce_duration: 8.0   # 动作事件最大合并时长 (秒)，杜绝常速巨石


yolo:
  enabled: true
  streaming_verify: true
  # 模型选型说明:
  # n/s/m 依次增大；实际显存、吞吐与召回取决于输入尺寸、批大小和素材
  # 当前保留 m 权重，改型前用同一人工验证集比较
  model_path: "models/yolo11m.pt"
  device: "cuda:0"
  # COCO 类别: 0:person, 15:cat, 16:dog (室内场景剔除 1:bicycle, 2:car, 3:motorcycle 等室外交通工具干扰)
  target_classes: [0, 15, 16]
  confidence: 0.3
  sample_fps: 2
  batch_size: 4  # 实际分批送入模型，限制显存峰值
  max_frames_per_file: 512  # 长文件均匀覆盖上限，避免候选 JPEG 无界增长

render:

  # 静态片段处理模式: hybrid_keyframe (幻灯片抽帧，极低解码压力)
  static_mode: "hybrid_keyframe"
  # 单文件 EDL 批次：每路渲染仅持有一个活动解码上下文
  batch_max_files: 1
  # 渲染总并发数：2 NVENC + 1 QSV = 3 并发 Worker
  max_concurrency: 3
  # QSV 允许消费的动态时长安全上限 (秒)：Intel UHD 770 (32EU) 在 <=420s 动态时保持高效分流，进一步均摊 NVENC 独显峰值负荷
  max_qsv_dynamic_duration_s: 420.0
  virtual_concat_enabled: true
  # 混合文件 EDL 灰度开关；启用前必须通过真实长文件的时长与音频闭环验证
  virtual_concat_mixed_enabled: true
  # EDL覆盖率过高时软件跳读收益不足，自动回退CUDA连续稀疏链
  virtual_concat_max_decode_ratio: 0.80
  # 混合文件保持单次连续解码，但在缩放/回下载前丢弃静态区间的冗余帧
  mixed_sparse_enabled: true
  # NAS 顺序读取到本地后再执行多区间 seek；单文件完成即删除，避免 SMB 随机寻址长尾
  local_staging_enabled: true
  # 静态区间保留代表画面；concat duration 仍覆盖完整源时间轴
  static_sample_window_s: 10.0
  # 相邻动态岛之间的短静态间隙直接顺序解码，减少重复开文件/解码器重建 (20s 仅合并转身换气停顿)
  dynamic_coalesce_gap_s: 20.0
  dynamic_window_max_s: 600.0
  qsv_timeout_s: 360         # QSV 硬件批次压制最大超时看门狗 (秒)
  startup_inactivity_timeout_s: 600.0 # 多输入 NAS 文件初始化阶段无进展阈值；首帧后立即切回严格阈值
  inactivity_timeout_s: 120.0 # 批次压制无进度停滞看门狗 (秒)，杜绝卡死挂起
  # R4: 动态变速过渡 (Speed Ramping)
  speed_ramping_enabled: false  # 按事件区间切换倍速，保持快进原声与画面使用同一线性时钟
  ramp_duration_s: 1.0
  # R4: 音频线性淡入淡出 (Linear Audio Cross-Fade)
  audio_fade_duration_s: 0.25
  # R4: 真实墙钟时间码 OSD 烧录与字幕生成 (视频左上角已有自带水印，默认关闭)
  timecode_osd_enabled: false
  # 生成 SRT 字幕文件: 将播放时间戳映射回真实监控墙钟时间，方便定位事件
  generate_subtitles: false

output:
  # 成片命名模板（高度自定义，支持热修改）：
  #   {date}   - 日期字符串 (如 20260402)
  #   {mac}    - 摄像机物理 MAC 地址 (如 B888805AA3CD)
  #   {camera} - 语义机位别名 (如 baby_room，未设置别名时自适应降级为 MAC 或 cam{index})
  #   {index}  - 摄像机逻辑编号数字 (如 0)
  naming: "DailyVlog_{date}_{mac}.mp4"
  resolution: "1920x1080"
  fps: 20

  # 离线高质量压制编码参数 (P4 + GOP120 + AQ + Lookahead，兼顾高压缩率与画质稳定)
  gop: 120
  nv:
    codec: "hevc_nvenc"
    preset: "p4"
    cq: 28
    maxrate: "4M"
    bufsize: "8M"
    gop: 120
    rc_lookahead: 32
    spatial_aq: 1
    temporal_aq: 1
    aq_strength: 8
    pix_fmt: "nv12"
  qsv:
    codec: "hevc_qsv"
    preset: "veryfast"
    global_quality: 28
    # ICQ质量控制；与maxrate/bufsize混用在本机驱动上会回退为固定CQP。
    gop: 120
    pix_fmt: "nv12"
  audio:
    codec: "aac"
    bitrate: "96k"
    channels: 1

logging:
  level: "INFO"
  rotation_max_bytes: 10485760
  rotation_backup_count: 5
  monitor_interval: 2.0
