# ===========================================================================
# HomeVlog 极限性能配置文件 (Target: Intel i5-12600K + NVIDIA RTX 3060Ti)
# ===========================================================================

paths:
  # 输入目录: 存放监控 MP4 素材文件 (可配置单路径字符串，或多路径列表)
  # 支持跨 NAS 共享目录与本地磁盘同时配置，系统按顺序逐一精准扫描
  input_dirs:
    - '\\192.168.5.8\LyuShare\XiaomiCamera_01_B888805AA3CD'
    # - '\\192.168.5.8\LyuShare\XiaomiCamera_02_6490C12345EF' # 多机位示例
    # - 'D:\LocalFootage\FrontDoor_Camera'                  # 本地机位示例


# 机位识别与人类友好别名映射
# 系统自动根据素材目录名解析小米摄像头 MAC 地址 (如 XiaomiCamera_01_B888805AA3CD 提取出 B888805AA3CD)
# 可以在此处将 MAC 地址映射为人类可读的机位名称，成片将自动命名为 DailyVlog_{date}_{camera}.mp4
cameras:
  B888805AA3CD: "baby_room"       # 婴儿房机位 (红外微光夜视敏感模式)
  # 6490C12345EF: "living_room"   # 客厅机位示例
  # 7811DC654321: "front_door"    # 门口机位示例

hardware:
  # 全局硬件加速设备: ["cuda:0", "cpu", "openvino"]
  # RTX 3060Ti 专职负责 YOLO 张量批推理与 Pass 2 (NVENC) 硬件视频编码
  device: "cuda:0"

  # 并发控制 (信号量隔离)
  # 消费级 NVIDIA 显卡限制并发会话: 设为 2 (3060Ti 8GB 显存黄金并发，留出 2GB 安全空间，杜绝换页)
  max_nv_concurrency: 2
  # QSV 硬件解码并发数 (Intel UHD 770 双 Gen12 VDBox 支撑 8 并发解码)
  max_qsv_concurrency: 8
  # 全局最大 IO 并发数 (控制同时打开的远程 SMB/本地文件句柄数)
  max_io_concurrency: 8


pipeline:
  # 渲染启动延迟 (秒): 等待分析队列积累素材，以便形成更大的渲染批次
  render_start_delay: 2
  # 预筛 GPU 分配策略: ["qsv_only", "alternating", "cuda_only"]
  # 默认 qsv_only: 预筛 100% 走 UHD 770，完全释放 RTX 3060Ti
  prescreen_gpu_policy: "qsv_only"

scheduler:
  # 自适应工作窃取水位线 (Adaptive Work-Stealing Watermarks)
  # 队列积压高水位线: 当待分析文件数 >= 该值且无渲染任务时，允许 NVDEC 协同加速
  watermark_high: 10
  # 队列积压低水位线: 当待分析文件数 <= 该值时，NVDEC 退出协同，回归 QSV 独占解码
  watermark_low: 3
  # 是否启用 NVDEC 协同解码 (与 QSV 协同抽干积压队列)
  nvdec_cooperative: true
  # NVDEC 最大协同解码并发数 (建议 1，避免争用显存与 PCIe 带宽)
  max_nv_decoders: 1
  # 冷启动破冰: 渲染任务就绪前优先用 NVDEC 加速分析队列消费 (实测 NVDEC 解码速度是 QSV 的 2-3 倍)
  cold_start_burst: true

recovery:
  # 是否跳过当天素材 (因为当天完整素材可能还没有备份完毕)
  skip_today: false
  # 文件稳定等待 (分钟): 0 表示不等待 (对于已完成的往日素材建议设为 0)
  scanner_freeze_minutes: 0
  # 磁盘空间保护 (GB): 剩余空间低于此值将停止流水线
  min_disk_space_gb: 20
  # 文件稳定性二次确认等待 (秒)
  file_stabilize_wait: 1.2

detection:
  # [Pass 1] 快速预筛 (Prescreen)
  prescreen_mode: "keyframes"
  prescreen_parallel: 8
  prescreen_segments: 10
  prescreen_resolution: "320x180"
  prescreen_diff_threshold: 8.0

  prescreen_extract_timeout: 120.0

  # [Pass 1.5] 精细分析 (Detailed Analysis)
  analysis_fps: 5
  analysis_resolution: "416x234" # 完美对齐 YOLO 推理尺寸
  analysis_max_workers: 8

  
  # 自适应 FPS: 长文件降低采样率以减少解码开销
  # 超长静止文件 (夜间) 降至 0.5fps 可再省 30-40% 解码时间，室内监控动作速度下不会漏检
  analysis_fps_adaptive: true
  analysis_fps_tiers:
    short: 5
    medium: 2
    long: 1
    ultra_long: 0.5
  analysis_fps_tier_thresholds:
    short_max: 120
    medium_max: 600
    long_max: 1800

  # 早停与时空置信度衰减 (Anti-Miss Early Termination)
  analysis_early_term_enabled: true
  analysis_early_term_window: 20
  analysis_early_term_threshold: 0.2
  early_term_cooldown_guard: true
  
  # R2: 时域滑动背景模型 (EMA Background)
  ema_background_enabled: true
  ema_alpha_bg: 0.05
  ema_alpha_fg: 0.005
  bg_diff_weight: 0.6
  fg_threshold: 12.0

  # R2: 动态空间网格 (8x8) 与抗噪过滤
  grid_rows: 8
  grid_cols: 8
  cooldown_half_life: 15.0
  min_connected_cells: 2
  cell_noise_alpha: 0.02
  base_noise_thresh: 1.5
  cluster_boost: 1.2

  # 检测算法调优
  motion_sensitivity: 1.0
  roi_crop: [0.1, 0.12, 0.8, 0.85]
  min_motion_frames: 3
  min_static_frames: 5
  noise_suppress_frames: 2
  median_filter_window: 7


audio_vad:
  # R3: 音频 VAD 多模态配置 (Voice Activity Detection & Multimodal Decision)
  enabled: true
  noise_margin_db: 12.0      # 相对底噪容限 (dB)
  min_dbfs: -42.0            # 绝对最低激活能量 (dBFS)
  window_ms: 50              # 短时 RMS 能量分帧窗口 (ms)
  speech_min_dur: 0.3        # 声音事件最小有效持续时间 (s)

segment:
  # 最小运动片段时长 (秒): 短于此值的动作片段将被平滑吸收
  min_motion_duration: 2.0
  # 最小静止片段时长 (秒): 短于此值的微小停顿将自动保持常速，避免眨眼式跳跃
  min_static_duration: 8.0
  # 允许的静止间隙容差 (秒): 两个相邻运动片段间隔小于此值时直接连接
  gap_tolerance: 1.5
  # 动态片段前后缓冲 (秒): 确保人物入画和动作余波完整无生硬截断
  pre_roll: 1.0
  post_roll: 1.5
  # 静态片段抽帧基准与过渡参数 (优化后：快进浓缩比提升，杜绝微小静态段膨胀成片)
  static_keyframe_interval: 45.0
  keyframe_display_duration: 0.35
  min_static_display_duration: 0.4
  min_segment_duration: 0.1
  macro_collapse_static: true

yolo:
  enabled: true
  streaming_verify: true
  # 触发式推理: 如果动作能量超过此值，认为显著运动，直接跳过 YOLO 推理
  skip_energy_threshold: 12.0
  model_path: "models/yolo11n.pt"
  device: "cuda:0"
  # COCO 类别: 0:person, 1:bicycle, 2:car, 3:motorcycle, 15:cat, 16:dog
  target_classes: [0, 1, 2, 3, 15, 16]
  confidence: 0.3
  sample_fps: 0.5

render:

  # 静态片段处理模式: hybrid_keyframe (幻灯片抽帧，极低解码压力)
  static_mode: "hybrid_keyframe"
  batch_max_files: 8
  # R4: 动态变速过渡 (Speed Ramping)
  speed_ramping_enabled: true
  ramp_duration_s: 1.0
  # R4: 音频线性淡入淡出 (Linear Audio Cross-Fade)
  audio_fade_duration_s: 0.25
  # R4: 真实墙钟时间码 OSD 烧录与字幕生成 (视频左上角已有自带水印，默认关闭)
  timecode_osd_enabled: false
  # 生成 SRT 字幕文件: 将播放时间戳映射回真实监控墙钟时间，方便定位事件
  generate_subtitles: false

output:
  naming: "DailyVlog_{date}_cam{index}.mp4"
  resolution: "1920x1080"
  fps: 20

  # 极限性能编码参数
  # cq 32: 在 1080p DailyVlog 浓缩场景下画质足够，比 cq 30 编码速度快 10-15%
  nv:
    codec: "hevc_nvenc"
    preset: "p1"
    cq: 32
    maxrate: "3M"
  qsv:
    codec: "hevc_qsv"
    preset: "veryfast"
    global_quality: 32
    maxrate: "3M"
  audio:
    codec: "aac"
    bitrate: "96k"
    channels: 1

logging:
  level: "INFO"
  rotation_max_bytes: 10485760
  rotation_backup_count: 5
  monitor_interval: 2.0
