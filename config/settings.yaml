# ===========================================================================
# HomeVlog 生产配置文件 (Target: Intel i5-12600K + NVIDIA RTX 3060Ti)
#
# 配置治理原则:
# 1. 分层治理: 场景预设 (Profile) -> 宏观主旋钮 (Sensitivity) -> 专家级显式微调
# 2. 机位绑定: 不同机位绑定专属预设 (baby_room / living_room / outdoor_corridor)
# 3. 预设提供经验默认值；当前样本尚未完成独立核验，预设识别质量待验收
# ===========================================================================

paths:
  # 输入目录: 存放监控 MP4 素材文件 (可配置单路径字符串，或多路径列表)
  # 支持跨 NAS 共享目录与本地磁盘同时配置，系统按顺序逐一精准扫描
  input_dirs:
    - '\\192.168.5.8\LyuShare\XiaomiCamera_01_B888805AA3CD'
    - '\\192.168.5.8\LyuShare\XiaomiCamera_00_B888806BD537' # 多机位示例
    # - 'D:\LocalFootage\FrontDoor_Camera'                  # 本地机位示例

# 机位识别与场景预设绑定 (Layer 1 & Layer 2)
# 系统自动根据素材目录名解析小米摄像头 MAC 地址并绑定场景预设：
# - baby_room: 婴儿房高敏模式 (极低微动门限 1.8，全黑红外夜视不误抑微动，啼哭 VAD 高敏唤醒)
# - living_room: 客厅标准模式 (防光影慢速漂移 12.0，白天有人驻留 4x 快进，夜间熟睡 16x 延时)
# - outdoor_corridor: 室外与走廊模式 (强抗噪，门限 3.5，抗车灯/树影漂移，关闭室内驻留)
cameras:
  B888805AA3CD:
    profile: "baby_room"          # 婴儿房机位 (红外微光夜视敏感模式)
    alias: "baby_room"
    motion_sensitivity: 1.0       # 机位主旋钮 (可选，默认 1.0)
  B888806BD537:
    profile: "living_room"        # 客厅机位 (标准生活起居模式)
    alias: "living_room"
    motion_sensitivity: 1.0

# ---------------------------------------------------------------------------
# 全局流水线与硬件编排 (核心拓扑与并发控制)
# ---------------------------------------------------------------------------
hardware:
  device: "cuda:0"
  max_nv_concurrency: 2
  max_qsv_concurrency: 8
  max_qsv_analysis_concurrency: 7
  max_qsv_render_concurrency: 1
  max_io_concurrency: 32

pipeline:
  render_start_delay: 2
  prescreen_gpu_policy: "qsv_only"
  render_gpu_policy: "heterogeneous"

scheduler:
  watermark_high: 6
  watermark_low: 3
  nvdec_cooperative: true
  max_nv_decoders: 2
  cold_start_burst: true
  vram_watermark_mb: 6200
  cooperative_during_render: true

recovery:
  skip_today: true
  scanner_freeze_minutes: 0
  min_disk_space_gb: 20
  file_stabilize_wait: 1.2

# ---------------------------------------------------------------------------
# 宏观检测控制与算法主旋钮 (全局默认值，未指定机位时生效)
# ---------------------------------------------------------------------------
detection:
  profile: "living_room"          # 全局默认场景 Profile
  motion_sensitivity: 1.0         # 全局灵敏度主旋钮 (0.5~2.0): 门限 = 基准门限 / sensitivity
  prescreen_mode: "keyframes"
  prescreen_parallel: 10
  prescreen_segments: 10
  prescreen_resolution: "320x180"
  prescreen_diff_threshold: 8.5
  prescreen_extract_timeout: 120.0
  analysis_fps: 5
  analysis_resolution: "416x234"
  analysis_max_workers: 7
  analysis_buffer_mb: 256
  analysis_fps_adaptive: true
  analysis_fps_tiers:
    short: 2
    medium: 1
    long: 0.5
    ultra_long: 0.5
  analysis_fps_tier_thresholds:
    short_max: 120
    medium_max: 600
    long_max: 1800
  timestamp_margin: 0.5

audio_vad:
  enabled: true
  sample_rate: 16000

segment:
  apply_smoothing: true

# ---------------------------------------------------------------------------
# AI 辅助多模态目标识别 (YOLO 目标过滤与保全)
# ---------------------------------------------------------------------------
yolo:
  enabled: true
  streaming_verify: true
  model_path: "models/yolo11m.pt"
  device: "cuda:0"
  target_classes: [0, 15, 16]     # 0:person, 15:cat, 16:dog
  confidence: 0.3
  sample_fps: 2
  batch_size: 4
  max_frames_per_file: 512

# ---------------------------------------------------------------------------
# 渲染与压制管道 (Render & Transcoding)
# ---------------------------------------------------------------------------
render:
  static_mode: "hybrid_keyframe"
  batch_max_files: 1
  max_concurrency: 3
  max_qsv_dynamic_duration_s: 420.0
  virtual_concat_enabled: true
  virtual_concat_mixed_enabled: true
  virtual_concat_max_decode_ratio: 0.80
  mixed_sparse_enabled: true
  local_staging_enabled: true
  static_sample_window_s: 10.0
  dynamic_coalesce_gap_s: 20.0
  dynamic_window_max_s: 600.0
  qsv_timeout_s: 360
  startup_inactivity_timeout_s: 600.0
  inactivity_timeout_s: 120.0
  speed_ramping_enabled: false
  ramp_duration_s: 1.0
  audio_fade_duration_s: 0.25
  timecode_osd_enabled: false
  generate_subtitles: false

output:
  naming: "DailyVlog_{date}_{mac}.mp4"
  resolution: "1920x1080"
  fps: 20
  gop: 120
  nv:
    codec: "hevc_nvenc"
    preset: "p4"
    cq: 28
    maxrate: "4M"
    bufsize: "8M"
    gop: 120
    rc_lookahead: 32
    spatial_aq: 1
    temporal_aq: 1
    aq_strength: 8
    pix_fmt: "nv12"
  qsv:
    codec: "hevc_qsv"
    preset: "veryfast"
    global_quality: 28
    gop: 120
    pix_fmt: "nv12"
  audio:
    codec: "aac"
    bitrate: "96k"
    channels: 1

logging:
  level: "INFO"
  rotation_max_bytes: 10485760
  rotation_backup_count: 5
  monitor_interval: 2.0

