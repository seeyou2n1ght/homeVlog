[project]
name = "homevlog"
version = "0.1.0"
description = "家庭监控素材智能浓缩系统 — 去静止帧、运动段原速、静止段关键帧快进"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "psutil>=7.2.2",
    "nvidia-ml-py>=13.0.0",
    "pyyaml>=6.0.3",
    "ultralytics>=8.4.48",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "av>=14.0.0",
    "rich>=13.0.0",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["backup", ".venv", "venv", ".git", "temp", "output"]

[tool.ruff.lint]
# Incremental adoption: fatal syntax, undefined names, invalid control flow.
select = ["E9", "F63", "F7", "F82"]
